name: Build J2ME app
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Download CLDC/MIDP stubs and ProGuard
        run: |
          mkdir -p lib build/classes dist
          M=https://repo1.maven.org/maven2/org/microemu
          curl -fL $M/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar -o lib/cldc.jar
          curl -fL $M/microemu-midp/2.0.4/microemu-midp-2.0.4.jar -o lib/midp.jar
          curl -fL https://github.com/Guardsquare/proguard/releases/download/v7.2.2/proguard-7.2.2.zip -o pg.zip
          unzip -q pg.zip
      - name: Compile
        run: |
          javac -source 1.3 -target 1.3 -bootclasspath lib/cldc.jar:lib/midp.jar -classpath lib/midp.jar -d build/classes src/*.java
          jar cf build/in.jar -C build/classes .
      - name: Preverify with ProGuard
        run: |
          java -jar proguard-7.2.2/lib/proguard.jar -injars build/in.jar -outjars build/out.jar \
            -libraryjars lib/cldc.jar -libraryjars lib/midp.jar \
            -microedition -dontobfuscate -dontoptimize -dontwarn \
            -keep "public class ModernNotes"
      - name: Package JAR + JAD
        run: |
          mkdir pre && cd pre && unzip -q ../build/out.jar && rm -rf META-INF && cd ..
          printf 'Manifest-Version: 1.0\nMIDlet-1: Modern Notes, , ModernNotes\nMIDlet-Name: Modern Notes\nMIDlet-Vendor: Me\nMIDlet-Version: 1.0.0\nMicroEdition-Configuration: CLDC-1.0\nMicroEdition-Profile: MIDP-2.0\n' > manifest.mf
          jar cfm dist/ModernNotes.jar manifest.mf -C pre .
          SIZE=$(stat -c%s dist/ModernNotes.jar)
          { sed '1d' manifest.mf; echo "MIDlet-Jar-URL: ModernNotes.jar"; echo "MIDlet-Jar-Size: $SIZE"; } > dist/ModernNotes.jad
      - uses: actions/upload-artifact@v4
        with:
          name: ModernNotes
          path: dist/
